# Build and test the wxqr binary on every push / PR.
#
# Matrix: 4 targets shipped in v0.1 (linux-musl x86_64 + aarch64,
# macos x86_64 + aarch64). Windows is `continue-on-error: true` and
# tracked for v0.2 promotion.
#
# All cross-compile cases use `cargo-zigbuild` so the host x86_64
# runner can produce aarch64 binaries without needing a separate
# musl-cross / osxcross toolchain.
#
# All jobs that touch opencv-rust's build.rs need libclang + LLVM:
#   - Linux: `apt install libclang-dev clang libopencv-dev pkg-config`
#   - macOS: `brew install llvm opencv@4 pkg-config`
#     + LIBCLANG_PATH=/opt/homebrew/opt/llvm/lib

name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, host)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang + OpenCV (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang libopencv-dev pkg-config

      - name: Install libclang + OpenCV (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          LIBCLANG_PATH: /opt/homebrew/opt/llvm/lib
        run: |
          brew install llvm opencv@4 pkg-config

      - name: Cache OpenCV build dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/src/**/opencv-*
            target/*/build/opencv-*
          key: opencv-test-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        # Note: `wechat_qrcode` is a feature of the `opencv` crate, not
        # of `wxqr` itself. We enable it via `opencv/wechat_qrcode` so
        # Cargo forwards it to the right package. We do NOT pass any
        # args after `--` because the wxqr binary test harness would
        # try to parse them as wxqr CLI args and fail with
        # "Unrecognized option: 'v'".
        run: cargo test --release --features="opencv/wechat_qrcode"

  build:
    name: build (${{ matrix.target }})
    # No `needs: test` — build matrix runs in parallel with test. The
    # matrix is the slow path (10+ min on cold cache) and the test
    # job is the fast gate; we don't want the matrix to wait for it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          # v0.1 ships only 4 targets; windows tracked here as
          # continue-on-error for v0.2 promotion.
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang libopencv-dev pkg-config

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          LIBCLANG_PATH: /opt/homebrew/opt/llvm/lib
        run: brew install llvm opencv@4 pkg-config

      - name: Cache OpenCV build dir (THIS IS THE BIG ONE)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/src/**/opencv-*
            target/*/build/opencv-*
            target/release/build/opencv-*
          key: opencv-build-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            opencv-build-${{ runner.os }}-${{ matrix.target }}-

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      - name: Build release (cargo-zigbuild for cross, cargo build for native host)
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo build --release --target ${{ matrix.target }} --locked --features="opencv/wechat_qrcode"
          else
            cargo zigbuild --release --target ${{ matrix.target }} --locked --features="opencv/wechat_qrcode"
          fi

      - name: Smoke test
        shell: bash
        run: |
          set -e
          BIN="target/${{ matrix.target }}/release/wxqr"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --version
          # The bundled models must exist; fail fast if they were
          # accidentally not committed.
          test -f models/detect.prototxt
          test -f models/detect.caffemodel
          test -f models/sr.prototxt
          test -f models/sr.caffemodel

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: wxqr-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wxqr*

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install libclang + OpenCV (for clippy's opencv-rust probe)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang libopencv-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # Clippy drives the full type-check of the wxqr bin, which pulls in
        # opencv-rust → clang-sys → libclang. Install libclang first or
        # the cargo clippy invocation panics with "couldn't find any
        # valid shared libraries matching: ['libclang.so', ...]".
        run: cargo clippy --all-targets --features="opencv/wechat_qrcode" -- -D warnings
      - name: cargo deny
        # v2 uses a cargo-deny release that supports Cargo.lock v4
        # (Cargo 1.93+ default). The v1 image ships an older cargo
        # that fails to parse lockfile v4 with "lock file version `4`
        # was found, but this version of Cargo does not understand
        # this lock file".
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  model-attribution:
    name: model MD5 verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify model MD5s match WeChatCV upstream
        run: |
          EXPECTED_DETECT_C="238e2b2d6f3c18d6c3a30de0c31e23cf"
          EXPECTED_DETECT_P="6fb4976b32695f9f5c6305c19f12537d"
          EXPECTED_SR_C="cbfcd60361a73beb8c583eea7e8e6664"
          EXPECTED_SR_P="69db99927a70df953b471daaba03fbef"
          test "$(md5sum models/detect.caffemodel | cut -d' ' -f1)" = "$EXPECTED_DETECT_C"
          test "$(md5sum models/detect.prototxt | cut -d' ' -f1)"  = "$EXPECTED_DETECT_P"
          test "$(md5sum models/sr.caffemodel | cut -d' ' -f1)"     = "$EXPECTED_SR_C"
          test "$(md5sum models/sr.prototxt | cut -d' ' -f1)"      = "$EXPECTED_SR_P"
          echo "All 4 model files match upstream WeChatCV."