# Build and test the wxqr binary on every push / PR.
#
# wxqr builds OpenCV from source via opencv-rust's contrib probe. That
# is a 10-15 minute compile on cold cache. To keep CI under budget we:
#   - cache the OpenCV source tree aggressively (the 1.5 GB build
#     dir is the slowest thing on earth to rebuild)
#   - ship only 4 platforms in v0.1 (linux-musl x86_64 + aarch64,
#     macos x86_64 + aarch64); windows is in CI as
#     continue-on-error and not released until v0.2.
#   - keep one Linux gnu build for the `cargo test` job to avoid
#     cross-compile noise around test execution.
#
# All jobs that touch opencv-rust's build.rs need libclang + LLVM:
#   - Linux: `apt install libclang-dev clang`
#   - macOS: xcode-select --install (or `brew install llvm`)

name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, gnu)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang + OpenCV (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang libopencv-dev pkg-config

      - name: Install libclang + OpenCV (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install llvm opencv@4 pkg-config
          # clang-sys searches for libclang.dylib; on macOS brew puts it
          # at /opt/homebrew/opt/llvm/lib/libclang.dylib (Apple Silicon)
          # which is not in dyld's default search path. Pointing
          # LIBCLANG_PATH at the directory makes clang-sys skip the
          # discovery dance.
          echo "LIBCLANG_PATH=/opt/homebrew/opt/llvm/lib" >> $GITHUB_ENV

      - name: Cache OpenCV build dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/src/**/opencv-*
            target/*/build/opencv-*
          key: opencv-test-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        # Note: `wechat_qrcode` is a feature of the `opencv` crate, not
        # of `wxqr` itself. We enable it via `opencv/wechat_qrcode` so
        # Cargo forwards it to the right package.
        run: cargo test --release --features="opencv/wechat_qrcode" -- -v

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            extra-deps: musl-tools,libclang-dev,clang
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            extra-deps: musl-tools,aarch64-linux-gnu-gcc,libclang-dev,clang
          - os: macos-13
            target: x86_64-apple-darwin
            extra-deps: llvm
          - os: macos-latest
            target: aarch64-apple-darwin
            extra-deps: llvm
          # v0.1 ships only 4 targets; windows tracked here as
          # continue-on-error for v0.2 promotion.
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile deps (Linux)
        if: matrix.extra-deps && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.extra-deps }} libopencv-dev pkg-config

      - name: Install cross-compile deps (macOS)
        if: matrix.extra-deps && runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          LIBCLANG_PATH: /opt/homebrew/opt/llvm/lib
        run: brew install ${{ matrix.extra-deps }}

      - name: Cache OpenCV build dir (THIS IS THE BIG ONE)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/src/**/opencv-*
            target/*/build/opencv-*
            target/release/build/opencv-*
          key: opencv-build-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            opencv-build-${{ runner.os }}-${{ matrix.target }}-

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Smoke test
        shell: bash
        run: |
          set -e
          EXT=""
          if [[ "${{ matrix.os }}" == windows* ]]; then
            EXT=".exe"
          fi
          BIN="target/${{ matrix.target }}/release/wxqr$EXT"
          "$BIN" --version
          # The bundled models must exist; fail fast if they were
          # accidentally not committed.
          test -f models/detect.prototxt
          test -f models/detect.caffemodel
          test -f models/sr.prototxt
          test -f models/sr.caffemodel

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: wxqr-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wxqr*

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install libclang + OpenCV (for clippy's opencv-rust probe)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang libopencv-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # Clippy drives the full type-check of the wxqr bin, which pulls in
        # opencv-rust → clang-sys → libclang. Install libclang first or
        # the cargo clippy invocation panics with "couldn't find any
        # valid shared libraries matching: ['libclang.so', ...]".
        run: cargo clippy --all-targets --features="opencv/wechat_qrcode" -- -D warnings
      - name: cargo deny
        # v2 uses a cargo-deny release that supports Cargo.lock v4
        # (Cargo 1.93+ default). The v1 image ships an older cargo
        # that fails to parse lockfile v4 with "lock file version `4`
        # was found, but this version of Cargo does not understand
        # this lock file".
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  model-attribution:
    name: model MD5 verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify model MD5s match WeChatCV upstream
        run: |
          EXPECTED_DETECT_C="238e2b2d6f3c18d6c3a30de0c31e23cf"
          EXPECTED_DETECT_P="6fb4976b32695f9f5c6305c19f12537d"
          EXPECTED_SR_C="cbfcd60361a73beb8c583eea7e8e6664"
          EXPECTED_SR_P="69db99927a70df953b471daaba03fbef"
          test "$(md5sum models/detect.caffemodel | cut -d' ' -f1)" = "$EXPECTED_DETECT_C"
          test "$(md5sum models/detect.prototxt | cut -d' ' -f1)"  = "$EXPECTED_DETECT_P"
          test "$(md5sum models/sr.caffemodel | cut -d' ' -f1)"     = "$EXPECTED_SR_C"
          test "$(md5sum models/sr.prototxt | cut -d' ' -f1)"      = "$EXPECTED_SR_P"
          echo "All 4 model files match upstream WeChatCV."